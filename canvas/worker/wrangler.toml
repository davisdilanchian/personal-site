# Cloudflare Worker config for the canvas sync backend.
# Deploy:  cd canvas/worker && npx wrangler deploy
# See canvas/README.md for the full one-time setup.

name = "canvas-sync"
main = "worker.js"
compatibility_date = "2024-11-01"

# KV namespace that holds the single encrypted board blob.
# Create it once with:  npx wrangler kv namespace create CANVAS_KV
# then paste the returned id below (replace REPLACE_WITH_KV_ID).
[[kv_namespaces]]
binding = "CANVAS_KV"
id = "REPLACE_WITH_KV_ID"
